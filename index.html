<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>From My Heart ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --red:#b71c1c;
  --soft:#ffd6e0;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:
    radial-gradient(circle at top,#ffe3ec,#f3a8b5,#8f123c);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Inter',sans-serif;
  overflow:hidden;
}

/* Floating hearts */
.heart{
  position:absolute;
  color:rgba(255,255,255,.85);
  animation:float 14s linear infinite;
  filter:blur(.2px) drop-shadow(0 0 10px rgba(255,255,255,.6));
}

@keyframes float{
  from{transform:translateY(120vh) scale(.8);opacity:0}
  20%{opacity:1}
  to{transform:translateY(-30vh) scale(1.3);opacity:0}
}

/* Glass card */
.card{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);
  padding:60px 65px;
  border-radius:32px;
  box-shadow:
    0 30px 80px rgba(0,0,0,.25),
    inset 0 0 0 1px rgba(255,255,255,.4);
  text-align:center;
  max-width:480px;
  z-index:2;
  animation:cardIn 1.2s cubic-bezier(.2,.9,.2,1);
  transition:all .6s ease;
}

@keyframes cardIn{
  from{transform:translateY(30px) scale(.92);opacity:0}
  to{transform:none;opacity:1}
}

h1{
  font-family:'Playfair Display',serif;
  font-size:26px;
  color:var(--red);
  margin-bottom:20px;
  animation:textFade .6s ease;
}

@keyframes textFade{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1}
}

input{
  width:100%;
  padding:16px 22px;
  border-radius:20px;
  border:1px solid #ddd;
  font-size:14px;
  outline:none;
  margin-top:22px;
  transition:.3s;
}

input:focus{
  border-color:var(--red);
  box-shadow:0 0 0 4px rgba(183,28,28,.12);
}

.buttons{
  display:flex;
  gap:20px;
  justify-content:center;
  margin-top:34px;
  position:relative;
}

button{
  border-radius:999px;
  border:1px solid var(--red);
  background:transparent;
  cursor:pointer;
  transition:all .35s ease;
  padding:15px 44px;
  font-size:14px;
  letter-spacing:.3px;
}

button:hover{
  background:var(--red);
  color:#fff;
  box-shadow:0 10px 30px rgba(183,28,28,.45);
  transform:translateY(-1px);
}

#message{
  margin-top:24px;
  font-size:13px;
  color:var(--red);
  min-height:18px;
  animation:textFade .4s ease;
}
</style>
</head>

<body>

<!-- Premium romantic music -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5c1c7a9f0b.mp3?filename=romantic-piano-112191.mp3">
</audio>

<script>
/* floating hearts */
for(let i=0;i<70;i++){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(16+Math.random()*26)+"px";
  h.style.animationDuration=(9+Math.random()*7)+"s";
  h.style.animationDelay=Math.random()*8+"s";
  document.body.appendChild(h);
}
</script>

<div class="card">
  <h1 id="question"></h1>
  <input id="answerInput" placeholder="Type gently here…" style="display:none">
  <div class="buttons">
    <button onclick="startMusic();yes()">Yes</button>
    <button id="noBtn" onclick="startMusic();no()">No</button>
  </div>
  <div id="message"></div>
</div>

<script>
let step=0,started=false;
const music=document.getElementById("music");
music.volume=0;

const answers={};

const questions=[
 {q:"Will you be my Valentine Taniya jii? ❤️",type:"yesno"},
 {q:"Kya aap meri life mein hamesha ke liye rehna chahti ho? 🫶",type:"input"},
 {q:"Who is closest to your heart? 💞",type:"input"},
 {q:"Mujhme aapko kya achcha lagta hai? ✨",type:"input"},
 {q:"Iss Valentine pe kya gift chahiye? 🎁",type:"input"},
 {q:"Life ki ek wish jo puri karni ho 🌙",type:"input"},
 {q:"Zindagi ka konsa moment hamesha yaad rahega? 💭",type:"input"}
];

function startMusic(){
  if(started) return;
  started=true;
  music.play();
  let v=0;
  const fade=setInterval(()=>{
    v+=0.02;
    music.volume=Math.min(v,.5);
    if(v>=.5) clearInterval(fade);
  },120);
}

function render(){
  document.getElementById("question").innerText=questions[step].q;
  const input=document.getElementById("answerInput");
  const noBtn=document.getElementById("noBtn");
  input.style.display=questions[step].type==="input"?"block":"none";
  noBtn.style.display=questions[step].type==="yesno"?"inline-block":"none";
}

render();

function no(){
  const b=document.getElementById("noBtn");
  b.style.position="absolute";
  b.style.left=Math.random()*220+"px";
  b.style.top=Math.random()*80+"px";
  document.getElementById("message").innerText="Hehe 😏 itna asaan nahi";
}

function yes(){
  const input=document.getElementById("answerInput");
  if(questions[step].type==="input"&&!input.value.trim()){
    document.getElementById("message").innerText="Just one sweet answer 💕";
    return;
  }
  answers["q"+step]=input.value||"Yes";
  input.value="";
  document.getElementById("message").innerText="";
  step++;
  if(step<questions.length){
    render();
  }else{
    const text=Object.values(answers).join("\n");
    setTimeout(()=>{
      location.href="https://wa.me/919411409919?text="+encodeURIComponent(text);
    },1800);
  }
}
</script>

</body>
</html>
